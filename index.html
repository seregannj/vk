<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Video Player</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; background: #f5f5f5; color: #222; }
        .wrap { max-width: 720px; margin: 0 auto; background: #fff; padding: 16px; border: 1px solid #ccc; }
        input { width: 60%; padding: 6px; box-sizing: border-box; }
        button { padding: 6px 12px; cursor: pointer; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; background: #000; display: block; margin-top: 10px; }
        .hint { font-size: 13px; color: #444; margin-top: 12px; line-height: 1.5; background: #eef; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h3>VK Video Player</h3>
        <input type="text" id="url" placeholder="https://vk.com/video-123456_789012">
        <button onclick="loadVideo()">Загрузить</button>
        
        <iframe id="player" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        
        <div class="hint">
            ⚠️ <b>Важно:</b> VK закрыл доступ к управлению качеством и скоростью извне.<br>
            ✅ Чтобы сменить качество или скорость: наведите курсор на видео → нажмите ⚙️ (шестеренку) внутри плеера.
        </div>
    </div>

    <script>
        function loadVideo() {
            const raw = document.getElementById('url').value.trim();
            
            // Ищем ID владельца и ID видео в любом формате ссылки
            // Поддерживает: vk.com/video-123_456, vk.com/clips?z=video-123_456, и т.д.
            const match = raw.match(/video(-?\d+)_(\d+)/);
            
            if (!match) {
                alert('Ссылка не распознана. Вставьте полную ссылку на видео из адресной строки.');
                return;
            }

            const oid = match[1]; // ID владельца (например, -123456)
            const vid = match[2]; // ID видео (например, 789012)

            // Используем современный официальный URL для встраивания
            // Это единственный стабильный способ на 2024-2026 год
            const embedUrl = `https://vk.com/video_ext.php?oid=${oid}&id=${vid}&hd=2`; 
            
            // hd=2 пытается форсировать 720p при старте, но VK может игнорировать это
            document.getElementById('player').src = embedUrl;
        }
    </script>
</body>
</html>
